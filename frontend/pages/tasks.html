<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SmartDocs - Tasks</title>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div class="app-shell">
  <div id="sidebar"></div>
  <div style="flex:1;display:flex;flex-direction:column;">
    <div id="topbar"></div>
    <main class="main-content">

      <div class="page-header">
        <h1 class="page-title">Tasks</h1>
        <p class="page-subtitle">Manage automatically generated tasks from document processing</p>
      </div>

      <!-- Task stats -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;">
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-label">Total Tasks</span>
            <div class="stat-icon" style="background:#F3F4F6;color:#6B7280;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            </div>
          </div>
          <div class="stat-value" id="total-tasks">5</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-label">Open</span>
            <div class="stat-icon yellow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
          </div>
          <div class="stat-value yellow" id="open-tasks">2</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-label">In Progress</span>
            <div class="stat-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            </div>
          </div>
          <div class="stat-value" id="inprog-tasks">2</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-label">Done</span>
            <div class="stat-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
          </div>
          <div class="stat-value green" id="done-tasks">1</div>
        </div>
      </div>

      <!-- Tasks list -->
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #F3F4F6;">
          <div>
            <div class="card-title">All Tasks</div>
            <div class="card-subtitle" id="task-count">5 tasks found</div>
          </div>
          <select class="select-field" id="status-filter" onchange="renderTasks()">
            <option value="">All Status</option>
            <option value="open">Open</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div id="tasks-list" style="padding:0 20px;"></div>
      </div>

    </main>
  </div>
</div>

<script src="../js/shared.js"></script>
<script>
Auth.require();
renderSidebar('tasks');
renderTopbar();

let tasks = [...Mock.tasks];

function updateStats() {
  document.getElementById('total-tasks').textContent = tasks.length;
  document.getElementById('open-tasks').textContent = tasks.filter(t=>t.status==='open').length;
  document.getElementById('inprog-tasks').textContent = tasks.filter(t=>t.status==='in-progress').length;
  document.getElementById('done-tasks').textContent = tasks.filter(t=>t.status==='done').length;
}

function renderTasks() {
  const f = document.getElementById('status-filter').value;
  const filtered = f ? tasks.filter(t=>t.status===f) : tasks;
  document.getElementById('task-count').textContent = `${filtered.length} task${filtered.length!==1?'s':''} found`;

  document.getElementById('tasks-list').innerHTML = filtered.length ? filtered.map(t => `
    <div style="border-bottom:1px solid #F3F4F6;padding:18px 0;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:14.5px;font-weight:600;color:#111827;">${t.title}</span>
            ${priorityBadge(t.priority)}
          </div>
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:#6B7280;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              ${t.document}
            </div>
            <div style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:#6B7280;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              ${t.assignee}
            </div>
            <div style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:#6B7280;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Due: ${t.due}
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          ${taskStatusBadge(t.status)}
          <select class="select-field" style="font-size:12.5px;padding:5px 28px 5px 10px;" onchange="changeStatus('${t.id}',this.value)">
            <option value="open" ${t.status==='open'?'selected':''}>Open</option>
            <option value="in-progress" ${t.status==='in-progress'?'selected':''}>In Progress</option>
            <option value="done" ${t.status==='done'?'selected':''}>Done</option>
          </select>
        </div>
      </div>
    </div>`).join('') : `<div class="empty-state">
      <div class="empty-state-title">No tasks found</div>
      <div class="empty-state-text">Try adjusting your filter</div>
    </div>`;
}

function changeStatus(id, newStatus) {
  const task = tasks.find(t => t.id === id);
  if (task) { task.status = newStatus; updateStats(); renderTasks(); showToast('Task status updated.', 'success'); }
}

updateStats();
renderTasks();
</script>
</body>
</html>
