services:
  postgres:
    image: postgres:16-alpine
    container_name: smartdocs-db
    environment:
      POSTGRES_DB: smartdocs
      POSTGRES_USER: smartdocs
      POSTGRES_PASSWORD: smartdocs123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartdocs-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: smartdocs
      RABBITMQ_DEFAULT_PASS: smartdocs123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: smartdocs-backend
    environment:
      DB_HOST: postgres
      DB_USERNAME: smartdocs
      DB_PASSWORD: smartdocs123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: smartdocs
      RABBITMQ_PASSWORD: smartdocs123
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-never-use-this-value-in-prod-32bytes}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-placeholder}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata: