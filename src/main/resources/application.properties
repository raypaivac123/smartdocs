server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/smartdocs
spring.datasource.username=smartdocs
spring.datasource.password=smartdocs123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

jwt.secret=smartdocs-super-secret-change-in-prod-min-256-bits
jwt.expiration-ms=86400000

anthropic.api.key=${ANTHROPIC_API_KEY:sk-placeholder}
anthropic.api.url=https://api.anthropic.com/v1/messages
