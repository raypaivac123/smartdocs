smartdocs.storage.path=./uploads
smartdocs.cors.allowed-origins=http://localhost:5173,http://localhost:80

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=smartdocs
spring.rabbitmq.password=smartdocs123

smartdocs.rabbitmq.exchange=document.exchange
smartdocs.rabbitmq.queue=document.processing.queue
smartdocs.rabbitmq.routing-key=document.processing